name: zoom-client
base: core24
adopt-info: zoom
summary: ZOOM Cloud Meetings
description: |
  Video conferencing with real-time messaging and content sharing

  https://zoom.us provides simplified video conferencing, whiteboard sharing
  and messaging across any device. This is an unofficial re-pack of the debian
  package provided by zoom.us

grade: stable
confinement: strict
compression: lzo
assumes:
  - snapd2.55

platforms:
  amd64:

apps:
  zoom-client:
    command: bin/launcher.sh
    command-chain:
      - snap/command-chain/alsa-launch
    environment:
      LD_LIBRARY_PATH: $SNAP/zoom/Qt/lib:$SNAP/zoom:$SNAP/zoom/cef:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      ALWAYS_USE_PULSEAUDIO: 1
    desktop: usr/share/applications/Zoom.desktop
    extensions: [ gnome ]
    plugs:
      - audio-playback
      - audio-record
      - browser-sandbox
      - camera
      - desktop
      - gsettings
      - hardware-observe
      - home
      - network
      - network-bind
      - network-manager-observe
      - opengl
      - pulseaudio
      - removable-media
      - screencast-legacy
      - screen-inhibit-control
      - shared-memory
      - system-observe
      - unity7
      - wayland
      - x11

plugs:
  browser-sandbox:
    interface: browser-support
    allow-sandbox: true

hooks:
  configure:
    plugs:
      - system-observe

layout:
  /etc/os_release:
    symlink: $SNAP_DATA/os-release

parts:
  alsa-mixin:
    plugin: dump
    source: https://github.com/diddlesnaps/snapcraft-alsa.git
    source-subdir: snapcraft-assets
    build-packages:
      - libasound2-dev
    stage-packages:
      - libasound2
      - libasound2-plugins

  zoom:
    source: https://zoom.us/client/latest/zoom_amd64.deb
    source-type: deb
    plugin: nil
    override-build: |
      # unset hardcoded LD_LIBRARY_PATHs
      sed -i s/D_LIBRAR/XXXXXXXX/g opt/zoom/ZoomLauncher
      sed -i s/T_AUTO_S/XXXXXXXX/g opt/zoom/ZoomLauncher
      sed -i s/LD_LIBRARY_PATH/XXXXXXXXXX_PATH/g opt/zoom/zopen opt/zoom/zoom

      # try fixing hardcoded /etc/os-release to allow wayland screen sharing
      sed -i "s;/os-release;/os_release;" opt/zoom/zoom
      sed -i "s;/os-release;/os_release;" opt/zoom/Qt/lib/libQt6Core.so.6

      sed -i "s;Prefix=/opt;Prefix=/snap/$SNAPCRAFT_PROJECT_NAME/current;" opt/zoom/qt.conf
      cp -av opt/zoom $CRAFT_PART_INSTALL/
      cp -av usr $CRAFT_PART_INSTALL/

      # remove danging symlink
      rm -rf $CRAFT_PART_INSTALL/usr/bin/zoom

      # fix icon and exec lines in desktop file
      sed -i 's|Icon=.*|Icon=${SNAP}/usr/share/pixmaps/Zoom.png|g' \
        $CRAFT_PART_INSTALL/usr/share/applications/Zoom.desktop
      sed -i 's|Exec=.*|Exec=zoom-client %U|g' \
        $CRAFT_PART_INSTALL/usr/share/applications/Zoom.desktop

      VER="$(strings $CRAFT_PART_INSTALL/zoom/zoom | \
           grep "[0-9].[0-9]*.[0-9] ([0-9]*)" | \
                                             head -1 | \
                                             sed 's/ (/./;s/)//')"
      craftctl set version="$VER"
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp -av $SNAPCRAFT_PROJECT_DIR/launcher.sh $CRAFT_PART_INSTALL/bin/
    build-packages:
      - binutils
    stage-packages:
      # HW-accel drivers — dlopen'd VA-API / VDPAU, invisible to the linter. Keep.
      - libva-drm2
      - libva-x11-2
      - libvdpau1
      # xcb libs used by Zoom's bundled Qt6 xcb platform plugin. Keep.
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-util1
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxcb-xtest0
      - libxkbcommon-x11-0
      - pulseaudio-utils
    stage:
      - -usr/lib/x86_64-linux-gnu/libharfbuzz.*
      - -usr/lib/x86_64-linux-gnu/libasound.so.*
    prime: # remove all of mesa, we want to use it from the extension
      - -usr/lib/x86_64-linux-gnu/dri
      - -usr/lib/x86_64-linux-gnu/libgbm.so.1
      - -usr/lib/x86_64-linux-gnu/libgbm.so.1.0.0
      - -usr/lib/x86_64-linux-gnu/libglapi.so.0.0.0
      - -usr/lib/x86_64-linux-gnu/libglapi.so.0
      - -usr/lib/x86_64-linux-gnu/libEGL_mesa.so.0
      - -usr/lib/x86_64-linux-gnu/libEGL_mesa.so.0.0.0
      - -usr/lib/x86_64-linux-gnu/libEGL.so.1
      - -usr/lib/x86_64-linux-gnu/libGLdispatch.so.0
      - -usr/lib/x86_64-linux-gnu/libGLdispatch.so.0.0.0
      - -usr/lib/x86_64-linux-gnu/libGLESv2.so.2
      - -usr/lib/x86_64-linux-gnu/libGL.so.1
      - -usr/lib/x86_64-linux-gnu/libGL.so.1.7.0
      - -usr/lib/x86_64-linux-gnu/libGLX_indirect.so.0
      - -usr/lib/x86_64-linux-gnu/libGLX_mesa.so.0
      - -usr/lib/x86_64-linux-gnu/libGLX_mesa.so.0.0.0
      - -usr/lib/x86_64-linux-gnu/libGLX.so.0
      - -usr/lib/x86_64-linux-gnu/libGLX.so.0.0.0

  schemas:
    plugin: nil
    build-packages:
      - libglib2.0-bin
    stage-packages:
      - gnome-settings-daemon-common
    override-prime: |
      set -eux
      craftctl default
      glib-compile-schemas usr/share/glib-2.0/schemas
    prime:
      - usr/share/glib-2.0/schemas

  cleanup:
    source: .
    plugin: nil
    after: [ alsa-mixin, zoom ]
    build-snaps:
      - gnome-46-2404
    override-prime: |
      craftctl default
      # remove any duplicated libs
      for lib in $(find $CRAFT_PRIME/zoom/ -type f -name "*.so*"); do
        echo "checking duplicates: $(basename $lib)"
        for files in $(find $CRAFT_PRIME/usr $CRAFT_PRIME/lib -name "*$(basename $lib)*" -type f); do
          rm -fv $files
        done
      done

      # --- Orphaned system ffmpeg-v60 + codec stack (Qt6-migration leftover) ---
      for L in libavcodec.so.60 libavutil.so.58 libswresample.so.4 \
               libvpx.so.9 libwebpmux.so.3 libspeex.so.1 librav1e.so.0 libtwolame.so.0 \
               libSvtAv1Enc.so.1 libsnappy.so.1 libsoxr.so.0 librsvg-2.so.2 \
               libtheora.so.0 libaom.so.3 libx264.so.164 libx265.so.199 \
               libcodec2.so.1.2 libdav1d.so.7 libgsm.so.1 libshine.so.3 \
               libxvidcore.so.4 libzvbi.so.0 libzvbi-chains.so.0 libnuma.so.1; do
        rm -fv $CRAFT_PRIME/usr/lib/*/$L*
      done
      # ALSA modules that link the now-removed ffmpeg (would dangle otherwise).
      rm -fv $CRAFT_PRIME/usr/lib/*/alsa-lib/libasound_module_pcm_a52.so \
             $CRAFT_PRIME/usr/lib/*/alsa-lib/libasound_module_rate_lavrate*.so

      # --- Orphaned Intel Media SDK / QSV (libmfx) — zero DT_NEEDED consumers ---
      rm -rfv $CRAFT_PRIME/usr/lib/*/mfx
      rm -fv  $CRAFT_PRIME/usr/lib/*/libmfx.so.1* \
              $CRAFT_PRIME/usr/lib/*/libmfxhw64.so.1* \
              $CRAFT_PRIME/usr/lib/*/libmfx-tracer.so.1*

      # --- Orphaned libs the linter flagged with zero consumers ---
      rm -fv $CRAFT_PRIME/usr/lib/*/libjackserver.so.0* \
             $CRAFT_PRIME/usr/lib/*/libjacknet.so.0* \
             $CRAFT_PRIME/usr/lib/*/libhwy_contrib.so.1* \
             $CRAFT_PRIME/usr/lib/*/libhwy_test.so.1*

      # --- Dedupe against the gnome-46-2404 runtime content snap (ogra1's trick) ---
      cd /snap/gnome-46-2404/current
      find . -type f,l | while read -r f; do
        case "$f" in
          ./meta/*|./snap/*) continue ;;
        esac
        rm -f "$CRAFT_PRIME/${f#./}"
      done

      # clean up unused cruft
      for CRUFT in bug lintian man themes; do
        rm -rf $CRAFT_PRIME/usr/share/$CRUFT
      done
      # drop all docs except licenses
      find $CRAFT_PRIME/usr/share/doc/ -type f -not -name 'copyright' -delete
      find $CRAFT_PRIME/usr/share -type d -empty -delete
